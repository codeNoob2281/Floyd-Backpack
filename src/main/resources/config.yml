logging:
  file:
    # Enable logging to a file
    enable: true
  # Log level
  level: INFO
command:
  backpack:
    clear:
      enable: true
      need-confirm: true
      confirm-interval: 5000
i18n:
  # Locale to use for internationalization
  locale: en

upgrade:
  # Whether backpack upgrade is enabled
  enabled: true
  # Maximum backpack level
  max-level: 6
  # Maximum slots
  max-slots: 54
  placeholder-item:
    material: GRAY_STAINED_GLASS_PANE
    name: "§7未解锁"
  levels:
    lv1: 9
    lv2: 18
    lv3: 27
    lv4: 36
    lv5: 45
    lv6: 54