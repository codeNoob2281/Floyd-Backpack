name: FloydBackpack
version: '1.1.0-SNAPSHOT'
main: com.floyd.backpack.FloydBackpackPlugin
api-version: '1.20'
prefix: Floyd-Backpack
load: STARTUP
authors: [ Floyd ]
softdepend:
  - Geyser-Spigot
description: floyd背包插件
website: https://github.com/codeNoob2281
commands:
  backpack:
    aliases:
      - bp
    description: 打开背包
permissions:
  floydbackpack.open:
    description: "允许玩家打开背包"
    default: true
  floydbackpack.clear:
    description: "允许玩家清空背包"
    default: op
  floydbackpack.reload:
    description: "重新加载配置"
    default: op
  floydbackpack.help:
    description: "显示帮助信息"
    default: true
  floydbackpack.version:
    description: "显示版本信息"
    default: true
  floydbackpack.upgrade:
    description: "升级背包"
    default: true
  floydbackpack.admin:
    description: "管理员权限（setlevel 等）"
    default: op
  floydbackpack.saveall:
    description: "立即触发全量保存"
    default: op